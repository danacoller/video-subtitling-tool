services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subtitles
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "
        cd /app &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/subtitles
      STORAGE_DIR: /data/videos
    volumes:
      - video_uploads:/data/videos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/subtitles
      STORAGE_DIR: /data/videos
    volumes:
      - video_uploads:/data/videos
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # One-off test runners (no profile — invoke with `docker compose run --rm …`)
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: pytest -q
    profiles: [test]

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: npm test
    profiles: [test]

volumes:
  postgres_data:
  video_uploads:
